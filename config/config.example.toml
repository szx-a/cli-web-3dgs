# gsflow 示例配置：复制为 config.toml 后按本机情况修改。
# 注意：config.toml 不入库（它含本机绝对路径）。

[project]
name = "gsflow"
workspace_dir = ""

[tools]
ffmpeg = ""
ffprobe = ""
colmap = ""
magick = ""

[capture]
mode = "auto"

[frames]
mode = "fps"
fps = 2.0
count = 120
long_side = 1920
crop = ""
blur_threshold = 0.0
max_frames = 0

[mask]
backend = "fastsam"
mode = "black"
dilate_px = 4
feather_px = 2
min_area_ratio = 0.002
keep_largest = true
batch_size = 4
mask_black_threshold = 8
on_failure = "keep"
erode_px = 0

[colmap]
cameras = "SIMPLE_RADIAL"
single_camera = true
max_image_size = 2048
max_num_features = 8192
use_gpu = true
guided_matching = true
max_num_matches = 32768
sfm_backend = "auto"
images = "auto"
min_num_matches = 32
multiple_models = false
matcher = "auto"
sequential_overlap = 12
vocab_tree_path = ""
use_masks = true
quality_min_registered_ratio = 0.75
quality_max_reproj_error = 2.0

[train]
backend = "gsplat"
iterations = 30000
resolution = 1600
sh_degree = 3
data_device = "cuda"
cap_max = 600000
eval = true
fp16 = false
seed = 42
densify_from = 500
densify_until = 4000
densify_interval = 100
densify_quantile = 0.0
auto_crop = true
auto_crop_in_train = false
auto_crop_threshold = 0.75
rasterize_mode = "classic"
absgrad = false
densify_grad_threshold = 0.0002
densify_criterion = "grad2d"
densify_grad2d_threshold = 0.0002
densify_grad_max = 0.005
densify_strategy = "builtin"
flatten_2dgs = false
flatten_log_scale = -6.0
grow_scale3d = 0.01
prune_scale3d = 0.1
prune_scale_after_reset = true
revised_opacity = 0.1
prune_opacity = 0.005
opacity_reset_interval = 0
opacity_decay = 1.0
opacity_decay_interval = 50
utilization_prune_interval = 0
utilization_prune_quantile = 0.2
utilization_prune_until = 0
recovery_prune_interval = 0
recovery_prune_quantile = 0.2
recovery_window = 300
recovery_prune_until = 0
opacity_cleanup = "none"
mask_loss_until = 1.0
mask_loss_mode = "composite"
opacity_reg = 0.0
scale_reg = 0.0
max_scale_ratio = 0.05
bg_alpha_reg = 0.1
max_aspect = 50.0
lr_means_scene_scale = false
lr_shs = 0.0025
auto_extend_densify_when_reset = true
mask_erode_px = 0
sh_rest_reg = 0.003
sh_rest_max = 0.0
opacity_crisp_reg = 0.02
opacity_crisp_warmup = 0.7
opacity_floor = 0.0
opacity_floor_reg = 0.0
opacity_floor_warmup = 0.5
opacity_init = 0.1
min_opacity_final = 0.0
lr_opacities = 0.025
lr_schedule = "cosine"
warmup_iters = 0
lr_min_ratio = 0.1
lr_quats = 0.001
lambda_lpips = 0.0
lpips_every = 1
lpips_size = 224
eval_metrics = true
best_metric = "psnr"
lambda_depth_distortion = 0.0
lambda_normal = 0.0
reg_interval = 8
depth_mode = "expected"
depth_distortion_mode = "tv"
extra_args = ""

[export]
formats = ["glb_points", "mesh", "viewer_html", "splat"]
glb_max_points = 800000
glb_shrink = 1.0
viewer_cdn = ""
mesh_method = "2dgs"
mesh_width = 640
mesh_max_views = 80
mesh_poisson_depth = 8
mesh_crop_quantile = 1.0
mesh_density_quantile = 0.001
mesh_trim_sigma = 2.5
mesh_target_triangles = 400000
mesh_presimplify_ratio = 10.0
mesh_smooth_iters = 5
mesh_largest_only = true
mesh_refine_iters = 100
mesh_watertight = true
mesh_texture = false
mesh_texture_size = 2048
mesh_texture_timeout = 300
mesh_texture_reject_black = true
mesh_drop_unseen = true
mesh_min_views = 1
mesh_consistency_min_views = 2
mesh_consistency_voxel_scale = 3.0
mesh_consistency_normal_dot = 0.0

[metrics]
enabled = true
num_views = 8

[web]
host = "127.0.0.1"
port = 8787
open_browser = false

[runtime]
max_parallel_jobs = 1
keep_intermediate = true
log_tail_lines = 400
